name: Deploy POC a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # 1 · el prototipo (React + Vite) va en la raíz
      - run: npm ci && npm run build
        working-directory: poc

      # 2 · la implementación sobre el stack real (Next.js) va en /stack
      - name: Verificar que el modelo económico no divergió
        run: npm ci && npm run check-economy
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          DEPLOY_TARGET: pages

      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp -r poc/dist/*      _site/
          cp -r mobbin-export   _site/flujos
          cp -r web/out         _site/stack

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
