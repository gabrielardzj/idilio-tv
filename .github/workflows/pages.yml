name: Deploy POC a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# El grupo lleva la rama a propósito. Con `pages` a secas, cualquier workflow
# del repositorio que declare ese mismo nombre cancela este —y eso es lo que
# pasaba: el despliegue del workspace paralelo arranca unos segundos después,
# mataba el de main y después fallaba él, así que no se publicaba nada. Con la
# rama dentro, main sigue cancelando sus propios despliegues encadenados, que es
# lo que este ajuste existe para hacer, y deja de ser cancelable desde fuera.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # 1 · el prototipo (React + Vite) va en la raíz
      - run: npm ci
        working-directory: poc
      - name: Verificar que ninguna cifra publicada quedó obsoleta
        run: npm run verificar
        working-directory: poc
      - run: npm run build
        working-directory: poc

      # El recorrido completo, no estados sueltos: home → serie → ver → muro.
      # Saltar a un estado con el panel prueba que el estado existe, no que se
      # pueda llegar a él. Esta comprobación ya encontró un bug que el panel
      # escondía: el episodio 1 de una serie sin empezar abría el muro.
      - name: Recorrer el prototipo, la acreditación del pase y la accesibilidad
        working-directory: poc
        run: |
          npx playwright install chromium-headless-shell --only-shell
          npx vite preview --port 5199 --strictPort &
          SERVIDOR=$!
          # el servidor se apaga pase lo que pase: si queda vivo, el runner lo
          # mata como proceso huérfano y el job termina en un estado raro
          trap 'kill $SERVIDOR 2>/dev/null || true' EXIT
          npx wait-on http://localhost:5199 -t 30000
          npm run recorrer
          npm run acreditacion
          npm run a11y

      # 2 · la implementación sobre el stack real (Next.js) va en /stack
      - name: Verificar que el modelo económico no divergió
        run: npm ci && npm run check-economy
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          DEPLOY_TARGET: pages

      # 3 · los entregables de texto, como páginas del sitio y no como markdown
      #     suelto en el repo: el brief pide un solo link con los cuatro.
      - run: node scripts/publicar-docs.mjs ../_site/docs
        working-directory: poc

      - name: Armar el sitio
        run: |
          cp -r poc/dist/*      _site/
          cp -r mobbin-export   _site/flujos
          cp -r web/out         _site/stack
          cp -r presentacion    _site/presentacion

      # El brief pide los cuatro entregables en un link. Esto comprueba que ese
      # link los alcance de verdad, y que ningún enlace interno del sitio caiga.
      - name: Verificar que el entregable se pueda recorrer entero
        run: node scripts/verificar-enlaces.mjs ../_site
        working-directory: poc

      # Las páginas de los documentos son cuatro de los cinco entregables y se
      # leen antes que nada. Se auditan acá y no con el prototipo porque hasta
      # este punto del job no existen: las genera `publicar-docs`.
      - name: Auditar la accesibilidad de los documentos
        run: SITIO_DOCS=../_site/docs node scripts/verificar-a11y.mjs about:blank
        working-directory: poc

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
